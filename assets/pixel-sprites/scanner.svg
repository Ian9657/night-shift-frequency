  <path fill="#a76269" d="M40 23h7v2h-7z"/>
  <path fill="#733e49" d="M45 25h2v2h-2z"/>
<path fill="#344b58" d="M18 21h3v13h-3z"/><path fill="#4b6470" d="M22 13h25v2H22z"/><path fill="#293d46" d="M17 55h4v4h-4zM51 55h5v4h-5z"/>
