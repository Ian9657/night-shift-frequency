<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 64" shape-rendering="crispEdges">
  <rect width="104" height="64" fill="none"/>

  <!-- 1. COUNTER DROP SHADOW & HEAVY BASE CONTACT -->
  <path fill="#0e1216" d="M12 56h84v6H12z"/>
  <path fill="#161c22" d="M8 50h88v8H8z"/>

  <!-- 2. MAIN HOUSING CHASSIS: compact matte dark charcoal commercial printer -->
  <!-- Right flank perspective depth (angled isometric body) -->
  <path fill="#181e26" d="M78 14h16v40H78z"/>
  <path fill="#242c36" d="M78 11h15v41h-15z"/>
  <!-- Right flank ventilation louvers & side parting line -->
  <path fill="#10141a" d="M82 22h10v2H82zM82 26h10v2H82zM82 30h10v2H82z"/>

  <!-- Main front chassis body (sturdy dark polymer housing) -->
  <path fill="#28323e" d="M8 14h72v39H8z"/>
  <path fill="#3c505b" d="M8 12h72v4H8z"/> <!-- upper front chamfer highlight -->
  <path fill="#1e2630" d="M8 52h72v4H8z"/> <!-- lower front base rim -->

  <!-- 3. TOP CLAMSHELL PAPER COVER LID (hinged top assembly) -->
  <!-- Top lid face -->
  <path fill="#405360" d="M10 6h66v8H10z"/>
  <path fill="#657a82" d="M10 6h66v2H10z"/> <!-- lid top rim catch-light -->
  <path fill="#202834" d="M10 13h68v2H10z"/> <!-- clamshell separation seam -->

  <!-- Cover release push-lever (right side of lid) -->
  <path fill="#161c24" d="M72 10h8v6h-8z"/>
  <path fill="#4c5e72" d="M73 11h6v4h-6z"/>
  <path fill="#6c829c" d="M73 11h6v1h-6z"/>

  <!-- 4. PAPER EXIT APERTURE & METAL SERRATED TEAR BAR -->
  <!-- Recessed paper slot well -->
  <path fill="#0c1014" d="M18 4h48v5H18z"/>
  <!-- Metallic serrated cutter blade bar -->
  <path fill="#768494" d="M18 7h48v2H18z"/>
  <path fill="#a5b8b5" d="M18 7h48v1H18z"/> <!-- sharp stainless blade edge -->
  <!-- Micro-protruding white receipt paper tongue (ready to feed/tear) -->
  <path fill="#e2e1d6" d="M22 2h40v4H22z"/>
  <path fill="#c4c9bf" d="M22 2h40v1H22z"/> <!-- paper cut line -->
  <path fill="#4e483c" d="M26 3h8v1h-8zM38 3h12v1h-12z"/> <!-- faint print on tip -->

  <!-- 5. CONTROL & DIAGNOSTIC INDICATOR CONSOLE (FRONT RIGHT) -->
  <!-- Recessed control bezel -->
  <path fill="#1a202a" d="M52 24h24v22H52z"/>
  <path fill="#222a36" d="M53 25h22v20H53z"/>

  <!-- Push-button: PAPER FEED (circular dark button) -->
  <path fill="#12161c" d="M56 28h16v6H56z"/>
  <path fill="#3c4856" d="M57 29h14v4H57z"/>
  <path fill="#5e7084" d="M57 29h14v1H57z"/> <!-- button top bevel -->
  <path fill="#8eafce" d="M63 30h2v2h-2z"/> <!-- arrow icon hint -->

  <!-- LED INDICATOR STRIP (POWER, ERROR, PAPER OUT) -->
  <!-- POWER LED [DARK GREEN - ACTIVE] -->
  <path fill="#101812" d="M56 38h4v4h-4z"/>
  <path fill="#2e783e" d="M57 39h2v2h-2z"/>
  <path fill="#54c26c" d="M57 39h1v1h-1z"/> <!-- active green diode pip -->

  <!-- ERROR LED [DARK RED - STANDBY] -->
  <path fill="#181010" d="M62 38h4v4h-4z"/>
  <path fill="#5c1e1a" d="M63 39h2v2h-2z"/>

  <!-- PAPER OUT LED [DARK AMBER - STANDBY] -->
  <path fill="#181610" d="M68 38h4v4h-4z"/>
  <path fill="#6c5016" d="M69 39h2v2h-2z"/>

  <!-- 6. BRAND BADGE & RECEDE CHASSIS GROOVE -->
  <!-- Sleek front horizontal accent groove -->
  <path fill="#18202a" d="M12 28h34v2H12z"/>
  <path fill="#3c4a5c" d="M12 30h34v1H12z"/>
  <!-- Minimalist rectangular brand badge plate -->
  <path fill="#1e2632" d="M12 36h20v6H12z"/>
  <path fill="#5a6e82" d="M14 38h16v2H14z"/>
<path fill="#2b3943" d="M8 16h3v36H8z"/><path fill="#4d656e" d="M14 8h39v2H14z"/>
</svg>
