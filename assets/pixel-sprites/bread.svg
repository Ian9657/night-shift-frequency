<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 48" shape-rendering="crispEdges">
  <!-- outline shadow -->
  <path fill="#627366" fill-opacity=".6" d="M21 2h14v3h6v4h5v4h3v22h-3v4H10v-4H7v-3H5V14h3v-4h5V7h5V4h3z"/>

  <!-- bag body – transparent plastic film, loose and breathable -->
  <path fill="#c5d4b8" d="M23 4h10v2h5v3h4v4h2v20h-2v3h-4v3H14v-3h-3v-2H9V15h3v-4h4V8h4V5h3z" opacity=".20"/>

  <!-- bread loaf – stacked slices with soft, organic crust profile -->
  <path fill="#7e5430" d="M15 20h26v14H14V24h1z"/>
  <path fill="#a87c48" d="M16 18h24v12H15V22h1z"/>
  <path fill="#c89c60" d="M18 17h8v2h10v8H17V21h1z"/>
  <path fill="#d4b97f" d="M20 17h5v2h-5zM29 19h6v2h-6z"/>
  <!-- slice separation lines -->
  <path fill="#8e6838" d="M16 23h11v1h-11zM31 23h9v1h-9zM18 27h15v1h-15zM36 27h3v1h-3z" opacity=".35"/>
  <!-- bottom crust -->
  <path fill="#5e3820" d="M14 33h28v3H14z"/>

  <!-- film overlay on bread – sheer plastic veil -->
  <path fill="#d0e0c4" d="M13 15h30v22H13z" opacity=".08"/>

  <!-- organic film wrinkles: radiated tension from clip & broken surface creases -->
  <path fill="#d8eacc" d="M22 7h1v4h-1zM20 11h1v4h-1zM32 7h1v3h-1zM34 10h1v5h-1z" opacity=".28"/>
  <path fill="#e2eed8" d="M16 16h1v10h-1zM17 28h1v5h-1z" opacity=".20"/>
  
  <path fill="#e2eed8" d="M38 17h1v15h-1z" opacity=".18"/>
  <!-- micro specular flecks -->
  

  <!-- bag side folds: broken, discontinuous creases to kill the rigid "drawn outline" look -->
  <path fill="#90a484" d="M10 15h2v6h-2zM11 25h2v7h-2zM44 16h2v7h-2zM43 27h2v6h-2z" opacity=".25"/>

  <!-- gathered bag mouth – soft converging tucks -->
  <path fill="#a8b89c" d="M19 7h5v4h-5zM32 7h5v4h-5z" opacity=".32"/>
  <path fill="#b4c4a8" d="M23 5h10v3H23z" opacity=".30"/>

  <!-- twist tie clip – asymmetrical red tab with plastic tension -->
  <path fill="#cc3535" d="M22 3h11v3h-11z"/>
  <path fill="#e04a4a" d="M23 4h8v1h-8z"/>
  <path fill="#981c1c" d="M22 2h9v1h-9zM23 6h10v1h-10zM33 4h2v2h-2z"/>

  <!-- bag bottom fold – softened tucked corners -->
  <path fill="#8c9c80" d="M13 37h28v2H13z" opacity=".22"/>
  <path fill="#7c8c70" d="M16 40h10v2H16zM31 40h8v2h-8z" opacity=".18"/>

  <!-- price label sticker – small, off-center -->
  <path fill="#d1d4b2" d="M34 25h6v5h-6z"/>
  <path fill="#7b8760" d="M36 26h2v3h-2z"/>
  

  <!-- back seam: gentle intermittent hint -->
  <path fill="#9cac90" d="M28 6h2v6h-2zM28 20h2v4h-2zM28 29h2v7h-2z" opacity=".10"/>
<path fill="#c5d7bf" d="M12 16h2v13h-2zM40 17h2v9h-2z" opacity=".3"/><path fill="#8caa91" d="M17 35h20v2H17z" opacity=".3"/>
</svg>
