<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <!-- 1. PRONOUNCED WALL CAST SHADOW (anchoring the clock firmly to the wall, offset bottom-right) -->
  <path fill="#141a1b" d="M16 18h70v64H16zM22 14h58v72H22z"/>
  <path fill="#202627" d="M14 20h72v60H14zM18 16h64v68H18z"/>

  <!-- 2. HEAVY CASING WALL STANDOFF & SIDE PROFILE (pronounced draft angle & depth on right/bottom) -->
  <path fill="#363c3d" d="M18 76h64v8H18zM78 16h8v68h-8zM76 74h8v8h-8z"/>
  <path fill="#515758" d="M20 74h60v4H20zM74 18h6v58h-6z"/>

  <!-- 3. AGED IVORY / OFF-WHITE INDUSTRIAL BEZEL (sturdy molded squircle with organic bevels) -->
  <!-- outer perimeter shadow line -->
  <path fill="#666c6d" d="M24 10h46v4H24zM16 18h62v4H16zM12 22h70v50H12zM16 72h62v4H16zM24 76h46v4H24z"/>
  <!-- front molded face -->
  <path fill="#b0baa6" d="M26 12h42v4H26zM18 20h58v4H18zM14 24h66v46H14zM18 70h58v4H18zM26 74h42v4H26z"/>
  <!-- top-left directional key light highlight on rounded casing bevel -->
  <path fill="#bac6bf" d="M26 12h40v2H26zM18 18h12v2H18zM14 24h4v36h-4z"/>

  <!-- 4. DEEP RECESSED DIAL BEVEL & CAVITY SHADOW (pronounced physical depth) -->
  <path fill="#767c7d" d="M24 16h44v4H24zM18 22h56v4H18zM16 26h60v42H16zM18 68h56v4H18zM24 72h44v4H24z"/>
  <!-- thick overhang shadow cast across top & left of the dial face -->
  <path fill="#313738" d="M24 18h46v6H24zM18 24h10v46H18zM28 24h40v4H28z"/>
  <path fill="#4c5253" d="M24 24h46v4H24zM22 28h6v38h-6z"/>

  <!-- 5. DIAL FACE: warm aged industrial ivory plate -->
  <path fill="#c9ccbb" d="M28 28h38v38H28zM24 34h46v26H24zM34 24h26v46H34z"/>
  <path fill="#d8d8c8" d="M30 30h34v34H30zM26 36h42v22H26zM36 26h22v42H36z"/>

  <!-- 6. 12 PIXEL HOUR MARKERS (NATURAL PRINT TEXTURE; UPPER ONES INTEGRATED INTO CAVITY SHADOW) -->
  <!-- Top 12 marker (subdued within upper shadow depth) -->
  <path fill="#1c2223" d="M46 26h3v5h-3z"/>
  <!-- Cardinal markers (3, 6, 9) - crisp bold printed bars -->
  <path fill="#161c1d" d="M64 45h5v3h-5z"/> <!-- 3 o'clock -->
  <path fill="#161c1d" d="M46 63h3v5h-3z"/> <!-- 6 o'clock -->
  <path fill="#161c1d" d="M26 45h5v3h-5z"/> <!-- 9 o'clock -->
  <!-- Sub-markers with natural optical presence (not sterile clones) -->
  <path fill="#2f3536" d="M57 30h2v3h-2z"/> <!-- 1 o'clock (under soft top shadow) -->
  <path fill="#252b2c" d="M63 36h3v2h-3z"/> <!-- 2 o'clock -->
  <path fill="#252b2c" d="M63 56h3v2h-3z"/> <!-- 4 o'clock -->
  <path fill="#252b2c" d="M57 61h2v3h-2z"/> <!-- 5 o'clock -->
  <path fill="#252b2c" d="M36 61h2v3h-2z"/> <!-- 7 o'clock -->
  <path fill="#252b2c" d="M29 56h3v2h-3z"/> <!-- 8 o'clock -->
  <path fill="#2f3536" d="M29 36h3v2h-3z"/> <!-- 10 o'clock (under left shadow) -->
  <path fill="#2f3536" d="M36 30h2v3h-2z"/> <!-- 11 o'clock (under top shadow) -->

  <!-- 8. CURVED DOMED GLASS REFLECTION (broad, clean crescent arc across the dome) -->
  <!-- main crescent sheen cutting across top-left quadrant of the crystal -->
  <path fill="#dce2d9" d="M34 22h14v2H34zM28 24h8v3h-8zM24 27h6v5h-6zM22 32h4v8h-4zM20 40h3v10h-3z" opacity=".28"/>
  <path fill="#dce2d9" d="M38 24h10v2H38zM30 27h8v3h-8zM26 32h4v6h-4zM24 40h2v8h-2z" opacity=".16"/>
  <!-- subtle lower-right interior bounce glint inside the bevel -->
  <path fill="#dce2d9" d="M64 68h8v2h-8zM70 62h2v6h-2z" opacity=".12"/>
</svg>
