<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 44" shape-rendering="crispEdges">
  <rect width="32" height="44" fill="none"/>

  <!-- 1. DROP SHADOW ON COUNTERTOP -->
  <path fill="#111718" d="M3 40h26v4H3z" opacity=".8"/>
  <path fill="#0a0c0a" d="M5 41h22v2H5z"/>

  <!-- 2. CONTENTS: STRAWS (Back slot, tallest) -->
  <!-- Straw 1 (White with red spiral stripe) -->
  <path fill="#171d1e" d="M7 6h3v24H7z"/> <!-- back slot interior shadow -->
  <path fill="#c9d4c8" d="M8 3h2v27H8z"/>
  <path fill="#a83830" d="M8 8h2v1H8zM8 15h2v1H8zM8 22h2v1H8z"/> <!-- muted straw stripes -->
  <path fill="#d5ddd1" d="M8 4h2v1H8z"/> <!-- top lip highlight -->
  
  <!-- Straw 2 (Slightly tilted / offset) -->
  <path fill="#c0cec2" d="M12 8h2v22h-2z"/>
  <path fill="#2f668c" d="M12 13h2v1h-2zM12 20h2v1h-2zM12 25h2v1h-2z"/> <!-- muted stripe variant -->

  <!-- 3. CONTENTS: WOODEN DESSERT SPOONS (Middle slot) -->
  <!-- Spoon 1: natural birch wood tone, oval scoop visible at top -->
  <path fill="#7a5830" d="M16 13h4v5h-4zM17 18h2v13h-2z"/> <!-- wood edge/shadow -->
  <path fill="#d2a874" d="M17 12h3v5h-3zM18 17h2v14h-2z"/> <!-- birch wood body -->
  <path fill="#d3c6a3" d="M18 12h2v4h-2z"/> <!-- spoon bowl highlight -->

  <!-- Spoon 2 -->
  <path fill="#b88e58" d="M22 13h3v4h-3zM23 17h2v14h-2z"/>

  <!-- 4. CONTENTS: WET WIPES PACKETS (Front slot, sealed poly-sachets) -->
  <!-- Sealed sachet with serrated top edge and green printing -->
  <path fill="#243428" d="M6 22h14v16H6z"/>
  <path fill="#d7e0d0" d="M7 23h12v15H7z"/>
  <path fill="#4f7a58" d="M10 28h6v1h-6zM11 32h4v1h-4z"/> <!-- subdued packet printing -->
  <path fill="#c4ccbe" d="M7 23h12v1H7z"/> <!-- crimp seal indent -->

  <!-- 5. ACRYLIC CADDY CONTAINER (Smoked/Clear plastic structure) -->
  <!-- Outer walls: smoked translucent plastic with sharp specular edges -->
  <path fill="#1e2422" d="M4 18h24v22H4z" opacity=".75"/>
  <!-- Front lower panel -->
  <path fill="#2c3834" d="M5 28h22v12H5z"/>
  <path fill="#40504a" d="M5 28h22v1H5z"/> <!-- front top rim highlight -->
  <path fill="#546a62" d="M5 28h1v12H5z"/> <!-- left edge corner highlight -->
  <path fill="#161c1a" d="M5 39h22v1H5z"/> <!-- bottom inner shadow -->

  <!-- Compartment divider ribs -->
  <path fill="#4a5e56" d="M15 29h1v10h-1z"/>
  <!-- Base foot grips -->
  <path fill="#121614" d="M6 40h4v1H6zM22 40h4v1H22z"/>
<path fill="#668176" d="M24 30h2v7h-2z" opacity=".32"/><path fill="#8ba092" d="M6 29h7v1H6z" opacity=".35"/>
</svg>
