<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" shape-rendering="crispEdges">
  <rect width="48" height="32" fill="none"/>

  <!-- 1. COUNTER DROP SHADOWS: grounding the bottom of the overlapping receipt stack -->
  <path fill="#1a1610" d="M6 26h36v4H6z" opacity=".6"/>
  <path fill="#120e08" d="M10 28h30v2H10z" opacity=".7"/>

  <!-- 2. RECEIPT #1 (BOTTOM-MOST BASE SHEET: horizontal slip resting on counter) -->
  <!-- Base paper shape -->
  <path fill="#c7c1b0" d="M4 16h34v12H4z"/>
  <!-- Bright thermal paper face -->
  <path fill="#d4cfc0" d="M6 16h30v11H6z"/>
  <!-- Left serrated register cutter edge (micro-notches) -->
  <path fill="#c4bca8" d="M4 16h1v2h-1zM4 19h1v2h-1zM4 22h1v2h-1zM4 25h1v2h-1z"/>
  <path fill="#d5d9cb" d="M5 16h1v11H5z"/>
  <!-- Thermal printed line items on bottom slip -->
  <path fill="#6c6454" d="M8 18h8v1H8zM18 18h4v1h-4zM24 18h6v1h-24z"/>
  <path fill="#6c6454" d="M8 21h12v1H8zM22 21h6v1h-6z"/>
  <path fill="#6c6454" d="M8 24h16v1H8z"/> <!-- subtotal line -->

  <!-- 3. RECEIPT #2 (MIDDLE SHEET: angled slip overlapping #1, extending to the right) -->
  <!-- Shadow cast by Receipt #2 onto Receipt #1 -->
  <path fill="#8a7e68" d="M16 12h2v15h-2z" opacity=".7"/>
  
  <!-- Middle sheet paper mass -->
  <path fill="#c4bda9" d="M18 10h26v16H18z"/>
  <path fill="#ccd0c0" d="M18 11h24v14H18z"/>
  <path fill="#d5d9cb" d="M18 11h24v1H18zM18 11h1v14h-1z"/> <!-- top/left crisp cut edge -->
  
  <!-- Right edge of middle sheet: torn bottom slip end -->
  <path fill="#c8bea8" d="M42 11h2v14h-2z"/>
  <path fill="#b4a890" d="M43 13h1v3h-1zM43 18h1v3h-1z"/> <!-- subtle tear notch -->

  <!-- Reduced barcode block: present, but not the main read -->
  <path fill="#4a4236" d="M24 20h1v3h-1zM27 20h2v3h-2zM31 20h1v3h-1zM34 20h2v3h-2zM38 20h1v3h-1z"/>
  <!-- Middle slip header text -->
  <path fill="#645c4c" d="M22 13h14v1H22zM24 15h12v1H24z"/>

  <!-- 4. RECEIPT #3 (TOP SHEET: smaller crumpled slip stuck & dog-eared across the junction) -->
  <!-- Shadow cast by Top slip onto Middle & Bottom slips -->
  <path fill="#685c48" d="M11 6h2v15h-2zM13 19h18v2H13z" opacity=".65"/>

  <!-- Top paper sheet mass: crushed, no longer a clean rectangle -->
  <path fill="#c0b6a0" d="M13 5h4V3h5v2h7v3h2v9h-3v3H14v-2h-3V9h2z"/>
  <path fill="#d2d6c7" d="M15 6h3V4h4v2h5v3h2v7h-3v2H15v-2h-2V10h2z"/>
  <path fill="#b9ad96" d="M18 3h4v4h-4z"/>
  <path fill="#d5d9cb" d="M18 3h4v1h-4zM17 4h1v3h-1z"/>
  
  <!-- Top sheet creased ridge highlight (sharp tensile fold) -->
  <path fill="#d5d9cb" d="M15 6h10v1H15zM14 8h1v7h-1zM22 6h5v1h-5z"/>

  <!-- Top sheet dog-ear curl (top-right corner peeling forward) -->
  <path fill="#c8bea6" d="M27 7h4v4h-4z"/>
  <path fill="#b2a68c" d="M28 8h3v3h-3z"/>
  <path fill="#d5d9cb" d="M27 6h4v1h-4zM26 7h1v4h-1z"/>

  <!-- Faint thermal dot matrix itemized lines on top slip -->
  <path fill="#4e4638" d="M16 8h7v1H16z"/>
  <path fill="#4e4638" d="M17 11h5v1h-5zM25 12h2v1h-2z"/>
  <path fill="#4e4638" d="M16 14h8v1H16z"/> <!-- bold total line -->

  <!-- 5. PHYSICAL ADHESION PINCH (WHERE SLIPS ARE COMPACTED / STUCK TOGETHER) -->
  <!-- Micro compression crease where the slips bond/overlap firmly -->
  <path fill="#7c7058" d="M17 15h2v2h-2zM23 17h2v1h-2z"/>
<path fill="#b5bdac" d="M20 16h3l12 3h-4z" opacity=".6"/><path fill="#dce0cf" d="M15 16h9v1h-9z"/>
</svg>
