<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Shift Frequency</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #07090f;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: manipulation;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas data-game aria-label="Night Shift Frequency"></canvas>
  <p class="sr-only" data-live aria-live="polite"></p>
  <script src="assets/sprite-data.js"></script>
  <script src="assets/font-data.js"></script>
  <script src="js/content/space.js"></script>
  <script src="js/content/layout.js"></script>
  <script src="js/content/strings.js"></script>
  <script src="js/content/colors.js"></script>
  <script src="js/content/poses.js"></script>
  <script src="js/content/customers.js"></script>
  <script src="js/content/story.js"></script>
  <script src="js/engine/shift.js"></script>
  <script src="js/core/time.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/text.js"></script>
  <script src="js/game/audio.js"></script>
  <script src="js/game/phone.js"></script>
  <script src="js/game/dialogue.js"></script>
  <script src="js/game/radio.js"></script>
  <script src="js/game/records.js"></script>
  <script src="js/game/broadcast.js"></script>
  <script src="js/game/checkout.js"></script>
  <script src="js/render/world.js"></script>
  <script src="js/render/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
